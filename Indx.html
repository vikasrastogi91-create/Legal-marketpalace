<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decentralized Legal Marketplace</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .btn { display: block; width: 100%; padding: 15px; margin: 15px 0; font-size: 18px; color: white; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; }
        .lawyer-btn { background-color: #1e3d59; }
        .client-btn { background-color: #ff6e40; }
        .note { color: #666; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>लीगल वेब3 मार्केटप्लेस</h1>
    <p>सुरक्षित, प्राइवेट और डिसेंट्रलाइज्ड कानूनी सेवाएं</p>
    
    <!-- वकील के लिए बटन (यहाँ ₹200/2.3 USDT का पेवॉल लिंक जुड़ेगा) -->
    <button class="btn lawyer-btn" onclick="connectWallet('lawyer')">मैं वकील हूँ (एंट्री फीस ₹200)</button>
    
    <!-- क्लाइंट के लिए बटन (यहाँ ₹200/2.3 USDT का पेवॉल लिंक जुड़ेगा) -->
    <button class="btn client-btn" onclick="connectWallet('client')">मैं क्लाइंट हूँ (एंट्री फीस ₹200)</button>
    
    <div class="note">TronLink Pro वॉलेट द्वारा सुरक्षित पेमेंट। आपकी प्राइवेसी हमारी जिम्मेदारी है।</div>
</div>

<script>
    function connectWallet(role) {
        alert(role + " प्रोफाइल के लिए TronLink Pro वॉलेट कनेक्ट हो रहा है। कृपया ₹200 (2.3 USDT) की फीस कन्फर्म करें।");
        // यहाँ भविष्य में आपका ट्रोन वॉलेट ट्रांजैक्शन कोड आएगा
    }
</script>

</body>
</html>
